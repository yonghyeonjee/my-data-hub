<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 구매 만족도 & 리뷰 이벤트 등록</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 24px 16px 60px; display: flex; justify-content: center; }
    .form-wrapper { width: 100%; max-width: 520px; background: white; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.04); overflow: hidden; }
    .form-header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 28px 24px; text-align: center; }
    .form-header h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .form-header p { font-size: 13px; color: #94a3b8; line-height: 1.5; }
    .form-body { padding: 28px 24px; }
    .field-group { margin-bottom: 18px; }
    .field-label { display: block; font-size: 13.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .field-label span.req { color: #ef4444; margin-left: 2px; }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; background: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .star-rating { display: flex; gap: 8px; font-size: 24px; cursor: pointer; color: #cbd5e1; }
    .star-rating .active { color: #fbbf24; }
    .radio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .radio-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .agree-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .agree-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #475569; margin-bottom: 8px; }
    .agree-item:last-child { margin-bottom: 0; }
    .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { background: #1d4ed8; }
    #successModal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: white; padding: 32px 24px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <div class="form-header">
      <h1>🎁 구매 고객 리뷰 & 혜택 신청</h1>
      <p>구매 만족도와 리뷰를 남겨주시면<br>맞춤 혜택과 사은품을 전달해 드립니다.</p>
    </div>

    <form class="form-body" id="customerForm" onsubmit="submitCustomerOrder(event)">
      <div class="field-group">
        <label class="field-label">고객 성함 <span class="req">*</span></label>
        <input type="text" id="custName" placeholder="예: 홍길동" required>
      </div>

      <div class="field-group">
        <label class="field-label">휴대폰 번호 <span class="req">*</span></label>
        <input type="tel" id="custPhone" placeholder="010-0000-0000" maxlength="13" oninput="autoHyphen(this)" required>
      </div>

      <div class="field-group">
        <label class="field-label">구매 채널 <span class="req">*</span></label>
        <select id="channelType" required>
          <option value="매장">오프라인 매장 방문</option>
          <option value="온라인">온라인 공식몰 / 스마트스토어</option>
          <option value="렌탈">가전 렌탈 약정</option>
          <option value="VMS">기업(B2B) / 복합기 소모품</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">상담 / 담당 프로</label>
        <select id="handlerSelect">
          <option value="김프로">김프로</option>
          <option value="이프로">이프로</option>
          <option value="박프로">박프로</option>
          <option value="홍프로">홍프로</option>
          <option value="시스템(온라인)">시스템(온라인/기타)</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">구매하신 제품명 <span class="req">*</span></label>
        <input type="text" id="prodName" placeholder="예: 갤럭시 Z 폴드8, 비스포크 냉장고 등" required>
      </div>

      <div class="field-group">
        <label class="field-label">만족도 평가</label>
        <div class="star-rating" id="starContainer">
          <span onclick="setRating(1)" class="active">★</span>
          <span onclick="setRating(2)" class="active">★</span>
          <span onclick="setRating(3)" class="active">★</span>
          <span onclick="setRating(4)" class="active">★</span>
          <span onclick="setRating(5)" class="active">★</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">리뷰 작성 여부 <span class="req">*</span></label>
        <div class="radio-grid">
          <label class="radio-card"><input type="radio" name="revStatus" value="작성완료" checked> 영수증/포토 리뷰 완료</label>
          <label class="radio-card"><input type="radio" name="revStatus" value="작성예정"> 3일 이내 작성 예정</label>
          <label class="radio-card"><input type="radio" name="revStatus" value="블로그/SNS"> 블로그/SNS 후기</label>
          <label class="radio-card"><input type="radio" name="revStatus" value="미작성"> 리뷰 미작성</label>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">리뷰 링크 또는 한줄 후기</label>
        <textarea id="reviewUrl" rows="2" placeholder="리뷰 링크(URL) 또는 이용 후기를 적어주세요."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">🎯 다음에 구매 또는 관심 있는 제품 (선택)</label>
        <input type="text" id="nextProduct" placeholder="예: 사운드바, 워치, 공기청정기 필터, 정수기 등">
      </div>

      <div class="agree-box">
        <div class="agree-item">
          <input type="checkbox" id="agreePrivacy" required checked>
          <label for="agreePrivacy"><b>[필수]</b> 개인정보 수집·이용 동의 (주문 및 이벤트 안내용)</label>
        </div>
        <div class="agree-item">
          <input type="checkbox" id="agreeMarketing" checked>
          <label for="agreeMarketing"><b>[선택]</b> 맞춤형 프로모션 및 재구매 할인 혜택 정보 수신 동의</label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">혜택 신청 및 등록 완료</button>
    </form>
  </div>

  <div id="successModal" class="hidden">
    <div class="modal-content">
      <h2 style="font-size: 20px; color: #16a34a; margin-bottom: 8px;">🎉 접수 완료</h2>
      <p style="font-size: 14px; color: #475569; margin-bottom: 20px; line-height: 1.5;">
        소중한 정보가 등록되었습니다.<br>담당 프로가 확인 후 혜택을 전달해 드립니다.
      </p>
      <button onclick="closeModal()" style="width:100%; padding:10px; background:#0f172a; color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer;">확인</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wdahskrcpjooqhwwxjiu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_O74WxjCsacx4G7Dtemgvlw_M9_6VtlW";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentRating = 5;

    function setRating(val) {
      currentRating = val;
      const stars = document.getElementById('starContainer').children;
      for (let i = 0; i < 5; i++) stars[i].classList.toggle('active', i < val);
    }

    function autoHyphen(target) {
      target.value = target.value.replace(/[^0-9]/g, '').replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3").replace(/(-{1,2})$/g, "");
    }

    async function submitCustomerOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "등록 처리 중...";

      const selectedStatus = document.querySelector('input[name="revStatus"]:checked').value;

      // sales_orders 단일 원장에 직접 적재
      const payload = {
        channel_type: document.getElementById('channelType').value,
        order_date: new Date().toISOString().split('T')[0],
        customer_name: document.getElementById('custName').value.trim(),
        customer_phone: document.getElementById('custPhone').value.trim(),
        product_name: document.getElementById('prodName').value.trim(),
        sales_amount: 0, // 고객 폼 기본값 (관리자가 원장에서 금액 수정 가능)
        refund_amount: 0,
        next_product: document.getElementById('nextProduct').value.trim(),
        handler: document.getElementById('handlerSelect').value,
        rating: currentRating,
        review_status: selectedStatus,
        review_url: document.getElementById('reviewUrl').value.trim(),
        marketing_consent: document.getElementById('agreeMarketing').checked,
        notes: `[고객 폼 접수] 만족도 ${currentRating}점 / 리뷰: ${selectedStatus}`
      };

      const { error } = await supabaseClient.from('sales_orders').insert([payload]);

      if (error) {
        alert("등록 실패: " + error.message);
        btn.disabled = false;
        btn.innerText = "혜택 신청 및 등록 완료";
      } else {
        document.getElementById('successModal').classList.remove('hidden');
        document.getElementById('customerForm').reset();
        setRating(5);
        btn.disabled = false;
        btn.innerText = "혜택 신청 및 등록 완료";
      }
    }

    function closeModal() {
      document.getElementById('successModal').classList.add('hidden');
    }
  </script>
</body>
</html>
