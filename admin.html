<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터 관리자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .hidden { display: none !important; }
    .box { background: white; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { background-color: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; }
    button.btn-danger { background-color: #ef4444; width: auto; padding: 6px 12px; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; color: #64748b; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- 1. 관리자 로그인 폼 -->
    <div id="loginSection" class="box" style="max-width: 400px; margin: 80px auto;">
      <h2 style="margin-bottom: 16px; text-align: center;">🔒 관리자 로그인</h2>
      <label>이메일</label>
      <input type="email" id="email" placeholder="admin@example.com">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="••••••••">
      <button type="button" onclick="login()">로그인</button>
      <p style="text-align: center; margin-top: 8px;"><a href="index.html" style="font-size: 13px; color: #64748b;">대민 페이지로 돌아가기</a></p>
    </div>

    <!-- 2. 관리자 CRUD 대시보드 영역 -->
    <div id="adminSection" class="hidden">
      <div class="header-bar">
        <h2>🛠️ 데이터 관리 대시보드</h2>
        <div>
          <a href="index.html" style="margin-right: 12px; font-size: 14px;">대민 화면 보기</a>
          <button type="button" onclick="logout()" style="width: auto; background: #64748b;">로그아웃</button>
        </div>
      </div>

      <!-- 데이터 추가/수정 폼 -->
      <div class="box">
        <h3 style="margin-bottom: 12px;">➕ 신규 데이터 등록</h3>
        <input type="text" id="itemCategory" placeholder="카테고리 (예: 공지, 리포트, 데이터)">
        <input type="text" id="itemTitle" placeholder="제목 입력">
        <textarea id="itemContent" rows="3" placeholder="상세 내용 입력"></textarea>
        <button type="button" onclick="createItem()">데이터 등록</button>
      </div>

      <!-- 데이터 리스트 및 삭제 -->
      <div class="box">
        <h3>📋 등록된 데이터 목록</h3>
        <table>
          <thead>
            <tr>
              <th style="width: 15%;">카테고리</th>
              <th style="width: 35%;">제목</th>
              <th style="width: 35%;">등록일시</th>
              <th style="width: 15%;">관리</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <!-- 데이터 동적 삽입 -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // 1. Supabase 클라이언트 설정 (수정된 URL과 Key 적용)
    const SUPABASE_URL = "https://wdahskrcpjooqhwwxjiu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_O74WxjCsacx4G7Dtemgvlw_M9_6VtlW";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. 세션 체크 및 UI 전환
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        fetchAdminData();
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminSection').classList.add('hidden');
      }
    }

    // 3. 관리자 로그인
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        alert("이메일과 비밀번호를 입력해주세요.");
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert("로그인 실패: " + error.message);
      } else {
        checkAuth();
      }
    }

    // 4. 로그아웃
    async function logout() {
      await supabaseClient.auth.signOut();
      checkAuth();
    }

    // 5. 데이터 생성 (INSERT)
    async function createItem() {
      const category = document.getElementById('itemCategory').value.trim();
      const title = document.getElementById('itemTitle').value.trim();
      const content = document.getElementById('itemContent').value.trim();

      if (!title || !category) return alert("카테고리와 제목을 입력하세요.");

      const { error } = await supabaseClient.from('items').insert([{ category, title, content }]);
      if (error) {
        alert("등록 실패: " + error.message);
      } else {
        document.getElementById('itemCategory').value = '';
        document.getElementById('itemTitle').value = '';
        document.getElementById('itemContent').value = '';
        fetchAdminData();
      }
    }

    // 6. 데이터 목록 조회
    async function fetchAdminData() {
      const { data, error } = await supabaseClient
        .from('items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = (data || []).map(item => `
        <tr>
          <td><span style="background:#eff6ff; color:#2563eb; padding:2px 6px; border-radius:4px; font-size:12px;">${item.category}</span></td>
          <td><b>${item.title}</b></td>
          <td style="color:#64748b; font-size:12px;">${new Date(item.created_at).toLocaleString()}</td>
          <td>
            <button type="button" class="btn-danger" onclick="deleteItem(${item.id})">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    // 7. 데이터 삭제 (DELETE)
    async function deleteItem(id) {
      if (!confirm("정말 삭제하시겠습니까?")) return;

      const { error } = await supabaseClient.from('items').delete().eq('id', id);
      if (error) {
        alert("삭제 실패: " + error.message);
      } else {
        fetchAdminData();
      }
    }

    // 세션 초기화 실행
    checkAuth();
  </script>
</body>
</html>
